<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHARE YOUR SECRET</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Anonymous Stories</h1>
    </header>

    <div class="container">
        <section class="story-form">
            <textarea id="storyContent" placeholder="Share your story..." rows="6"></textarea>
            <button id="submitStory">Submit</button>
        </section>

        <section class="story-list">
            <h2>Stories</h2>
            <div id="storyFeed">
                <!-- Stories will appear here -->
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
